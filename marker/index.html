<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CNLT432CYL"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CNLT432CYL');
    </script>
    <title>Circle Detection Tool</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">
</head>
<body>
    <div class="container">
        <div id="viewer">
            <div id="hoverGuide"></div>
            <a href="../index.html" class="home-button">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
        <div class="sidebar">
            <div class="controls">
                <input type="file" id="fileInput" accept=".stl">
                <input type="file" id="jsonInput" accept=".json" style="display: none;">
                <button id="resetView" class="button">Reset View</button>
                <button id="loadJson" class="button">Load JSON</button>
                <button id="resetAll" class="button">Reset All</button>
                <button id="selectFace" class="button">Select Top Face</button>
                <button id="selectSlideFaces" class="button">Select Slide Faces</button>
                <button id="selectFrontFace" class="control-button">Select Front Face</button>
            </div>

            <div class="export-section">
                <h3>Export Data</h3>
                <label>
                    <span>Author:</span>
                    <input type="text" id="authorName" placeholder="Your Name">
                </label>
                <label>
                    <span>Download Link:</span>
                    <input type="text" id="downloadLink" placeholder="https://...">
                </label>
                <button id="exportData" class="button">Export JSON</button>
            </div>

            <div id="status"></div>
            <div id="detectedCircles"></div>
            <div id="slideFaces" class="panel">
                <h3>Slide Face Groups:</h3>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="app.js"></script>
    <script src="../js/cookie-consent.js"></script>
</body>
</html>
